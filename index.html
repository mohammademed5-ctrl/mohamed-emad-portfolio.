    <script>
        const SUPABASE_URL = "https://pcnbtxcsumhoxtuhcoka.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Y5C4FNyzuGLNBnK6cvUT7g_-E4xc_Yf";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. خلفية الجزيئات الذهبية
        (function initParticles() {
            const canvas = document.getElementById('luxuryCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            resize();
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 1.8 + 0.6
                });
            }
            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.45)';
                    ctx.fill();
                });
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // 2. تشغيل نافذة القفل (Admin Modal)
        async function openAdminModal() {
            const modal = document.getElementById('adminModal');
            if (!modal) return;
            modal.classList.remove('hidden');
            try {
                const { data: { session } } = await sb.auth.getSession();
                document.getElementById('loginView').classList.toggle('hidden', !!session);
                document.getElementById('dashboardView').classList.toggle('hidden', !session);
            } catch (e) {
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('dashboardView').classList.add('hidden');
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        async function handleSupabaseLogin() {
            const email = document.getElementById('adminEmailInput').value.trim();
            const password = document.getElementById('adminPassInput').value.trim();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginErrorMsg');
            errEl.classList.add('hidden');
            btn.innerText = "جاري التحقق...";
            const { error } = await sb.auth.signInWithPassword({ email, password });
            btn.innerText = "تسجيل الدخول الآمن";
            if (error) {
                errEl.innerText = "بيانات الدخول غير صحيحة أو الحساب غير مفعل";
                errEl.classList.remove('hidden');
            } else {
                openAdminModal();
            }
        }

        async function handleSupabaseLogout() {
            await sb.auth.signOut();
            location.reload();
        }

        async function uploadAsset(type, inputId) {
            const file = document.getElementById(inputId).files[0];
            if (!file) return alert("اختر الصورة أولاً");
            const safeName = `${type}_${Date.now()}.${file.name.split('.').pop()}`;
            const { error } = await sb.storage.from('portfolio_assets').upload(safeName, file);
            if (error) return alert("خطأ في الرفع: " + error.message);

            const { data } = sb.storage.from('portfolio_assets').getPublicUrl(safeName);
            const updateField = type === 'logo' ? { logo_url: data.publicUrl } : { portrait_url: data.publicUrl };
            const { error: dbErr } = await sb.from('portfolio_settings').upsert({ id: 1, ...updateField });
            if (dbErr) return alert("خطأ في الحفظ: " + dbErr.message);

            alert("تم الحفظ في السحابة بنجاح!");
            location.reload();
        }

        async function publishProjectToSupabase() {
            const title = document.getElementById('newWorkTitle').value.trim();
            const category = document.getElementById('newWorkCategory').value.trim() || "تصميم خاص";
            const description = document.getElementById('newWorkDesc').value.trim();
            const file = document.getElementById('newWorkImgInput').files[0];
            if (!title || !file) return alert("اكتب العنوان واختر الصورة");

            const safeName = `work_${Date.now()}.${file.name.split('.').pop()}`;
            const { error } = await sb.storage.from('portfolio_assets').upload(safeName, file);
            if (error) return alert("خطأ في الرفع: " + error.message);

            const { data } = sb.storage.from('portfolio_assets').getPublicUrl(safeName);
            const { error: dbErr } = await sb.from('portfolio_projects').insert([{ title, category, description, image_url: data.publicUrl }]);
            if (dbErr) return alert("خطأ في الحفظ: " + dbErr.message);

            alert("تم نشر التصميم لجميع الزوار!");
            location.reload();
        }

        async function deleteProjectFromSupabase(id) {
            if (!confirm("هل تريد حذف هذا التصميم نهائياً؟")) return;
            await sb.from('portfolio_projects').delete().eq('id', id);
            location.reload();
        }

        // 3. محرك استوديو التصميم التفاعلي
        const studioPresets = {
            ad: { name: 'إعلان تجاري', ratio: '1080 × 1080 PX', w: 900, h: 900, badge: 'EXCLUSIVE COMMERCIAL', title: 'ROYAL COLLECTION', sub: 'ارتقِ بهوية علامتك التجارية إلى مستوى عالمي', bg: '#09090b', accent: '#D4AF37', text: '#FFFFFF' },
            logo: { name: 'هوية وشعار', ratio: '1000 × 1000 PX', w: 900, h: 900, badge: 'EST. 2026', title: 'PIXELPERFECT', sub: 'LUXURY VISUAL IDENTITY', bg: '#050505', accent: '#E5C158', text: '#FCF6BA' },
            banner: { name: 'بانر احترافي', ratio: '1920 × 820 PX', w: 1000, h: 450, badge: 'PREMIUM STUDIO', title: 'CREATIVE EXCELLENCE', sub: 'تصميمات احترافية متكاملة للشركات والبراندات', bg: '#0c0a09', accent: '#D4AF37', text: '#FFFFFF' },
            social: { name: 'سوشيال ميديا', ratio: '1080 × 1350 PX', w: 800, h: 1000, badge: 'SPECIAL OFFER', title: 'STAND OUT NOW', sub: 'محتوى بصري يجذب انتباه جمهورك من اللحظة الأولى', bg: '#0a0a0c', accent: '#BF953F', text: '#F5F5F5' },
            product: { name: 'إعلان منتج فاخر', ratio: '1080 × 1080 PX', w: 900, h: 900, badge: 'LIMITED EDITION', title: 'SIGNATURE SERIES', sub: 'جودة استثنائية وتفاصيل مصممة بإتقان', bg: '#080705', accent: '#F3D06B', text: '#FFFFFF' }
        };

        let currentStudioTpl = 'ad';
        let studioUploadedImg = null;

        function selectStudioTemplate(tplKey) {
            currentStudioTpl = tplKey;
            const p = studioPresets[tplKey];
            document.getElementById('studioBadgeInput').value = p.badge;
            document.getElementById('studioTitleInput').value = p.title;
            document.getElementById('studioSubInput').value = p.sub;
            document.getElementById('studioBgColor').value = p.bg;
            document.getElementById('studioAccentColor').value = p.accent;
            document.getElementById('studioTextColor').value = p.text;
            document.getElementById('studioFormatLabel').innerText = p.ratio;

            document.querySelectorAll('.studio-tpl-btn').forEach(btn => {
                const active = btn.dataset.tpl === tplKey;
                btn.className = active
                    ? 'studio-tpl-btn px-3 py-2.5 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-200 transition'
                    : 'studio-tpl-btn px-3 py-2.5 rounded-xl text-xs font-bold border border-neutral-800 bg-neutral-900/80 text-neutral-300 hover:border-amber-500/50 transition';
            });
            renderStudioCanvas();
        }

        function applyStudioPalette(bg, accent, text) {
            document.getElementById('studioBgColor').value = bg;
            document.getElementById('studioAccentColor').value = accent;
            document.getElementById('studioTextColor').value = text;
            renderStudioCanvas();
        }

        function handleStudioImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() { studioUploadedImg = img; renderStudioCanvas(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetStudioDesign() {
            studioUploadedImg = null;
            document.getElementById('studioAssetInput').value = '';
            selectStudioTemplate(currentStudioTpl);
        }

        function renderStudioCanvas() {
            const c = document.getElementById('studioPreviewCanvas');
            if (!c) return;
            const sCtx = c.getContext('2d');
            const p = studioPresets[currentStudioTpl];
            c.width = p.w; c.height = p.h;

            const bg = document.getElementById('studioBgColor').value || '#09090b';
            const accent = document.getElementById('studioAccentColor').value || '#D4AF37';
            const textColor = document.getElementById('studioTextColor').value || '#FFFFFF';
            const badgeText = document.getElementById('studioBadgeInput').value || '';
            const titleText = document.getElementById('studioTitleInput').value || '';
            const subText = document.getElementById('studioSubInput').value || '';

            sCtx.fillStyle = bg;
            sCtx.fillRect(0, 0, c.width, c.height);

            const pad = Math.round(Math.min(c.width, c.height) * 0.055);
            sCtx.strokeStyle = accent;
            sCtx.lineWidth = 3;
            sCtx.strokeRect(pad, pad, c.width - pad * 2, c.height - pad * 2);

            const cx = c.width / 2;
            const isBanner = currentStudioTpl === 'banner';
            let contentY = isBanner ? c.height * 0.22 : c.height * 0.20;

            if (studioUploadedImg) {
                const maxImgSize = isBanner ? 115 : 210;
                const scale = Math.min(maxImgSize / studioUploadedImg.width, maxImgSize / studioUploadedImg.height);
                const iw = studioUploadedImg.width * scale;
                const ih = studioUploadedImg.height * scale;
                sCtx.drawImage(studioUploadedImg, cx - iw / 2, contentY - 10, iw, ih);
                contentY += ih + 35;
            } else {
                const emblemR = isBanner ? 34 : 58;
                sCtx.beginPath();
                sCtx.arc(cx, contentY + emblemR * 0.5, emblemR, 0, Math.PI * 2);
                sCtx.strokeStyle = accent;
                sCtx.lineWidth = 3;
                sCtx.stroke();
                sCtx.fillStyle = accent;
                sCtx.font = `900 ${emblemR}px Cinzel, serif`;
                sCtx.textAlign = 'center';
                sCtx.textBaseline = 'middle';
                sCtx.fillText('P', cx, contentY + emblemR * 0.55);
                contentY += emblemR * 2 + 30;
            }

            if (badgeText) {
                sCtx.fillStyle = accent;
                sCtx.font = `700 ${isBanner ? 16 : 22}px Montserrat, Cairo, sans-serif`;
                sCtx.textAlign = 'center';
                sCtx.fillText(badgeText.toUpperCase(), cx, contentY);
                contentY += isBanner ? 44 : 60;
            }

            sCtx.fillStyle = textColor;
            sCtx.font = `900 ${isBanner ? 44 : 58}px Cinzel, Cairo, sans-serif`;
            sCtx.textAlign = 'center';
            sCtx.fillText(titleText, cx, contentY, c.width - pad * 3);

            contentY += isBanner ? 24 : 36;
            sCtx.beginPath();
            sCtx.moveTo(cx - 80, contentY);
            sCtx.lineTo(cx + 80, contentY);
            sCtx.strokeStyle = accent;
            sCtx.lineWidth = 3;
            sCtx.stroke();

            contentY += isBanner ? 36 : 50;
            sCtx.fillStyle = textColor;
            sCtx.font = `600 ${isBanner ? 20 : 26}px Cairo, Montserrat, sans-serif`;
            sCtx.fillText(subText, cx, contentY, c.width - pad * 3);

            sCtx.fillStyle = accent;
            sCtx.font = '700 14px Montserrat, sans-serif';
            sCtx.fillText('PIXELPERFECT STUDIO • PREVIEW', cx, c.height - pad - 18);
        }

        function downloadStudioDesign() {
            const c = document.getElementById('studioPreviewCanvas');
            const link = document.createElement('a');
            link.download = `PixelPerfect-${currentStudioTpl}-${Date.now()}.png`;
            link.href = c.toDataURL('image/png');
            link.click();
        }

        function orderStudioDesign() {
            const tplName = studioPresets[currentStudioTpl].name;
            const title = document.getElementById('studioTitleInput').value;
            const sub = document.getElementById('studioSubInput').value;
            const bg = document.getElementById('studioBgColor').value;
            const accent = document.getElementById('studioAccentColor').value;
            const hasLogo = studioUploadedImg ? 'نعم (تم إرفاق شعار/صورة)' : 'بدون شعار مرفق';
            const msg = `مرحباً مهندس محمد عماد، قمت بتجربة تصميم في INTERACTIVE DESIGN STUDIO وأرغب في طلبه:\n• نوع القالب: ${tplName}\n• العنوان: ${title}\n• الوصف: ${sub}\n• الألوان: خلفية (${bg}) / ذهبي (${accent})\n• شعار خاص: ${hasLogo}`;
            window.open(`https://wa.me/201006102339?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // 4. تشغيل فوري عند الفتح + جلب الصور من السيرفر
        selectStudioTemplate('ad');

        (async function loadAllAssets() {
            const logoImg = document.getElementById('customLogoImg');
            const logoLetter = document.getElementById('defaultLogoLetter');
            const portraitImg = document.getElementById('heroPortraitImg');
            if (logoLetter) logoLetter.classList.add('loaded');

            try {
                const { data: settings } = await sb.from('portfolio_settings').select('*').eq('id', 1).maybeSingle();
                if (settings && settings.logo_url) {
                    logoImg.onload = () => {
                        logoLetter.classList.add('hidden');
                        logoImg.classList.remove('hidden');
                        logoImg.classList.add('loaded');
                    };
                    logoImg.src = settings.logo_url;
                }
                if (settings && settings.portrait_url) {
                    portraitImg.onload = () => portraitImg.classList.add('loaded');
                    portraitImg.src = settings.portrait_url;
                } else {
                    portraitImg.onload = () => portraitImg.classList.add('loaded');
                    portraitImg.src = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80";
                }
            } catch (e) {
                portraitImg.src = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80";
                portraitImg.classList.add('loaded');
            }

            const { data: { session } } = await sb.auth.getSession();
            const isAdmin = !!session;
            const { data: items } = await sb.from('portfolio_projects').select('*').order('created_at', { ascending: false });
            if (items) {
                const grid = document.getElementById('projectsGrid');
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "glass-panel project-card rounded-2xl overflow-hidden flex flex-col justify-between group";
                    card.innerHTML = `
                        <div>
                            <div class="relative h-52 overflow-hidden bg-neutral-900">
                                <img src="${item.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                <span class="absolute top-3 right-3 px-3 py-1 rounded-full text-[11px] font-bold bg-black/75 text-amber-300 border border-amber-500/40">${item.category}</span>
                                ${isAdmin ? `<button onclick="deleteProjectFromSupabase('${item.id}')" class="absolute top-3 left-3 w-8 h-8 rounded-full bg-red-600 text-white text-xs flex items-center justify-center shadow-lg"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-white mb-2">${item.title}</h3>
                                <p class="text-neutral-400 text-sm leading-relaxed">${item.description}</p>
                            </div>
                        </div>
                        <div class="px-6 pb-6">
                            <a href="https://wa.me/201006102339" target="_blank" class="w-full py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold hover:bg-amber-500 hover:text-black transition flex items-center justify-center gap-2">
                                <span>اطلب تصميم مماثل</span><i class="fa-brands fa-whatsapp"></i>
                            </a>
                        </div>`;
                    grid.prepend(card);
                });
            }
        })();
    </script>
